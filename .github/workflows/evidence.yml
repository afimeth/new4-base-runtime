name: Fixture evidence
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: false
      - name: Go worker invariants
        run: python scripts/go_evaluate.py evidence/ci-go-eval.json
      - name: Public UTF-8 boundary
        run: python scripts/check_public.py
      - name: Execute fixture scenarios
        run: python app.py evaluate --output evidence/ci-eval.json
      - name: Verify and project source-bound results
        run: python scripts/project.py --report evidence/ci-eval.json --output evidence/ci-evidence.md
      - name: Verify committed local report binding
        run: python scripts/project.py --verify-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            evidence/ci-eval.json
            evidence/ci-evidence.md
            evidence/ci-go-eval.json
